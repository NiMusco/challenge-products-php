<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 font-sans text-sm text-gray-900">
  <div class="mx-auto max-w-4xl p-4 pb-20">
    <h1 class="mb-4 text-2xl font-bold">Productos</h1>

    <div id="flash" class="mb-3 hidden border p-2" role="status"></div>

    <div class="mb-2 flex items-center justify-between">
      <h2 class="text-lg font-semibold">Listado</h2>
      <div class="flex gap-2">
        <button type="button" id="new-product-btn" class="border border-gray-500 bg-blue-600 px-3 py-1 text-white">
          Nuevo producto
        </button>
        <button type="button" id="refresh-btn" class="border border-gray-500 bg-gray-200 px-3 py-1">
          Actualizar
        </button>
      </div>
    </div>

    <table class="w-full border-collapse border border-gray-400 bg-white">
      <thead>
        <tr class="bg-gray-200 text-left">
          <th class="border border-gray-400 p-2">ID</th>
          <th class="border border-gray-400 p-2">Nombre</th>
          <th class="hidden border border-gray-400 p-2 md:table-cell">Descripción</th>
          <th class="border border-gray-400 p-2">Precio ARS</th>
          <th class="border border-gray-400 p-2">Precio USD</th>
          <th class="w-16 min-w-16 border border-gray-400 p-2">
            <span class="flex justify-center">
              <img src="icons/settings.svg" alt="Acciones" title="Acciones" class="h-4 w-4">
            </span>
          </th>
        </tr>
      </thead>
      <tbody id="products-body">
        <tr>
          <td colspan="6" class="border border-gray-400 p-2 text-center">Cargando...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer class="fixed bottom-0 left-0 right-0 border-t border-gray-400 bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between p-3">
      <button type="button" id="prev-page" class="border border-gray-500 bg-gray-200 px-3 py-1">
        Anterior
      </button>
      <span id="page-info">Página 1</span>
      <button type="button" id="next-page" class="border border-gray-500 bg-gray-200 px-3 py-1">
        Siguiente
      </button>
    </div>
  </footer>

  <dialog id="product-dialog" class="w-full max-w-md border border-gray-400 bg-white p-4 backdrop:bg-black/40">
    <h2 id="form-title" class="mb-3 text-lg font-semibold">Nuevo producto</h2>

    <form id="product-form" class="space-y-2" method="dialog" novalidate>
      <input type="hidden" id="product-id" value="">

      <div>
        <label for="nombre">Nombre</label><br>
        <input id="nombre" name="nombre" type="text" required class="w-full border border-gray-400 p-1">
      </div>

      <div>
        <label for="descripcion">Descripción</label><br>
        <textarea id="descripcion" name="descripcion" required rows="2" class="w-full border border-gray-400 p-1"></textarea>
      </div>

      <div>
        <label for="precio">Precio (ARS)</label><br>
        <input id="precio" name="precio" type="number" required min="0" step="0.01" class="w-full border border-gray-400 p-1">
      </div>

      <div class="flex items-center justify-between pt-2">
        <button type="button" id="cancel-btn" class="border border-gray-500 bg-gray-200 px-3 py-1">
          Cancelar
        </button>
        <button type="submit" id="submit-btn" class="border border-gray-500 bg-blue-600 px-3 py-1 text-white">
          Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
