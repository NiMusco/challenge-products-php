# Credentials and shared settings are defined ONCE below (YAML anchors),
# then reused by `db` (MySQL image) and `api` (same MYSQL_* names).

x-db-credentials: &db-credentials
  MYSQL_DATABASE: productos
  MYSQL_USER: productos
  MYSQL_PASSWORD: secret

services:

  # PHP API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      <<: *db-credentials
      PRECIO_USD: "1500"
      DB_HOST: db
      DB_PORT: "3306"
      API_BASE_URL: http://127.0.0.1
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/productos') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Pest HTTP tests (waits for healthy api + db)
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *db-credentials
      PRECIO_USD: "1500"
      DB_HOST: db
      DB_PORT: "3306"
      API_BASE_URL: http://api
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["composer"]
    command: ["test"]

  # MySQL database
  db:
    image: mysql:8.0
    environment:
      <<: *db-credentials
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Swagger UI
  swagger:
    build:
      context: ./swagger
      dockerfile: Dockerfile
    ports:
      - "8082:8080"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # Browser-reachable API URL (host machine), not the Docker service name
      API_BASE_URL: http://localhost:8081
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/icons:/usr/share/nginx/html/icons:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
