services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host 8081 avoids clashes with other local services often bound to 8080
      - "8081:80"
    environment:
      PRECIO_USD: ${PRECIO_USD:-1000}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: productos
      DB_USERNAME: productos
      DB_PASSWORD: secret
    volumes:
      # Bind mount for live code reload in development
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productos
      MYSQL_USER: productos
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
