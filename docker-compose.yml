services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host 8081 avoids clashes with other local services often bound to 8080
      - "8081:80"
    environment:
      PRECIO_USD: ${PRECIO_USD:-1500}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: productos
      DB_USERNAME: productos
      DB_PASSWORD: secret
      # Pest uses a dedicated MySQL container (db_test), not the app DB
      DB_TEST_HOST: db_test
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: productos
    volumes:
      # Bind mount for live code reload in development
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productos
      MYSQL_USER: productos
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated MySQL for Pest tests
  db_test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productos
      MYSQL_USER: productos
      MYSQL_PASSWORD: secret
    volumes:
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  swagger:
    build:
      context: ./swagger
      dockerfile: Dockerfile
    ports:
      - "8082:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      # Keep built Tailwind CSS from the image; hot-reload HTML/JS/icons
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/icons:/usr/share/nginx/html/icons:ro
    depends_on:
      - api

volumes:
  mysql_data:
  mysql_test_data:
