services:

  # PHP API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      PRECIO_USD: ${PRECIO_USD:-1500}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: productos
      DB_USERNAME: productos
      DB_PASSWORD: secret
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # MySQL database
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: productos
      MYSQL_USER: productos
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Swagger UI
  swagger:
    build:
      context: ./swagger
      dockerfile: Dockerfile
    ports:
      - "8082:8080"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro
      - ./frontend/icons:/usr/share/nginx/html/icons:ro
    depends_on:
      - api

volumes:
  mysql_data:
